<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>NutriBae Đăng Nhập</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="form-container">

    <h1>Đăng nhập</h1>

    <form id="loginForm">

        <input 
            type="email" 
            id="loginEmail"
            placeholder="Email" 
            required
        >

        <input 
            type="password" 
            id="loginPassword"
            placeholder="Password" 
            required
        >

        <button type="submit">
            Đăng nhập
        </button>

        <p style="margin-top: 15px; text-align: center;">
            Bạn chưa có tài khoản ?
            <a href="register.html" style="color:#1db954;">Đăng ký ngay</a>
        </p>

    </form>

</div>

<script src="login.js"></script>

</body>
</html>
